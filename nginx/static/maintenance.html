<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maintenance — GameNime</title>
  <meta name="description" content="GameNime est en maintenance. Revenez bientôt." />

  <style>
    :root{
      --bg:#0b0b0f;
      --card: rgba(15,15,20,.58);
      --border: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --shadow: 0 20px 70px rgba(0,0,0,.55);
      --radius: 20px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      background: var(--bg);
      overflow:hidden;
    }

    /* Background image */
    .bg{
      position:fixed;
      inset:0;
      background:
        radial-gradient(900px 500px at 50% 30%, rgba(255,160,90,.18), transparent 60%),
        url("background.jpg") center/cover no-repeat;
      transform: scale(1.02);
      filter: saturate(1.15) contrast(1.05);
    }

    /* Dark overlay for readability */
    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(to bottom, rgba(10,10,14,.86), rgba(10,10,14,.72)),
        radial-gradient(900px 500px at 50% 25%, rgba(0,0,0,.0), rgba(0,0,0,.35));
      backdrop-filter: blur(2px);
    }

    main{
      position:relative;
      width:min(860px, calc(100% - 32px));
      padding: 28px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(22px, 4vw, 36px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom: 10px;
    }

    .logo{
      width:42px;height:42px;border-radius:12px;
      background: radial-gradient(circle at 30% 25%, rgba(255,210,140,.9), rgba(255,95,60,.85));
      box-shadow: 0 10px 30px rgba(255,120,70,.20);
      display:grid;place-items:center;
      font-weight:800;
    }

    h1{
      margin: 0 0 8px 0;
      font-size: clamp(24px, 3.2vw, 40px);
      letter-spacing: -0.02em;
    }

    p{
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.55;
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap: 12px;
      margin-top: 18px;
      align-items:center;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 14px;
      color: rgba(255,255,255,.82);
    }

    .dot{
      width:10px;height:10px;border-radius:50%;
      background: #ff8a4c;
      box-shadow: 0 0 0 6px rgba(255,138,76,.12);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{ transform: scale(1); opacity: .9;}
      50%{ transform: scale(1.08); opacity: 1;}
    }

    footer{
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,.55);
    }

    a{color:inherit}
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main>
    <section class="card">
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <div style="font-weight:700;letter-spacing:.2px;">GameNime</div>
          <div style="font-size:12px;color:rgba(255,255,255,.60);">Nouveautés animés & jeux vidéo</div>
        </div>
      </div>

      <h1>Maintenance en cours</h1>
      <p>
        Le site est en préparation. Le site ouvre bientôt.
      </p>

      <div class="row">
        <div class="pill"><span class="dot"></span> Mise à jour / déploiement</div>
        <div class="pill">Merci pour votre patience ✨</div>
      </div>

      <footer>
        © <span id="y"></span> GameNime — Tous droits réservés
      </footer>
    </section>
  </main>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
