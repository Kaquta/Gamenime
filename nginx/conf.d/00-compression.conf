# Compression du texte. Sans elle, /games/ partait a 230 ko bruts une fois
# l'index par mois ajoute. text/html n'est pas listee : nginx la compresse
# toujours, la lister est inutile.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/xml
  application/rss+xml
  application/javascript
  text/javascript
  application/json
  image/svg+xml;
