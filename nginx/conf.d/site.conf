# ------------------------------------------------------------
# WebSocket helper (OK en haut du fichier conf.d)
# ------------------------------------------------------------
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ------------------------------------------------------------
# HTTP : ACME + redirect staging + maintenance prod
# ------------------------------------------------------------
server {
  listen 80;
  server_name gamenime.fr www.gamenime.fr staging.gamenime.fr;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  if ($host = staging.gamenime.fr) {
    return 301 https://$host$request_uri;
  }

  location / {
    root /etc/nginx/static;
    try_files /maintenance.html =503;
  }
}

# ------------------------------------------------------------
# HTTPS PROD : maintenance
# ------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name gamenime.fr www.gamenime.fr;

  ssl_certificate     /etc/letsencrypt/live/gamenime.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamenime.fr/privkey.pem;

  root /etc/nginx/static;

  location / {
    try_files /maintenance.html =503;
  }
}

# ------------------------------------------------------------
# HTTPS STAGING : privé (Basic Auth) + site + APIs + n8n
# ------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name staging.gamenime.fr;

  ssl_certificate     /etc/letsencrypt/live/gamenime.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamenime.fr/privkey.pem;

  auth_basic "Staging prive";
  auth_basic_user_file /etc/nginx/htpasswd/staging.htpasswd;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # -------------------------
  # APIs (content-api)
  # -------------------------
  location /api/anime/ {
    proxy_pass http://content-api:3000/anime/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/games/ {
    proxy_pass http://content-api:3000/games/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # -------------------------
  # n8n PUSH (WebSocket) -> évite "Lost connection"
  # -------------------------
  location ^~ /n8n/rest/push {
    auth_basic off;

    proxy_pass http://n8n:5678/rest/push;
    proxy_http_version 1.1;

    # CRUCIAL: ne pas forward le BasicAuth staging à n8n
    proxy_set_header Authorization "";

    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /n8n;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
    proxy_cache off;
  }

  # (optionnel selon versions) Socket.IO
  location ^~ /n8n/socket.io/ {
    auth_basic off;

    proxy_pass http://n8n:5678/socket.io/;
    proxy_http_version 1.1;

    proxy_set_header Authorization "";

    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /n8n;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
  }

  # -------------------------
  # n8n (UI + REST + assets)
  # IMPORTANT: / à la fin -> enlève /n8n/ avant d'envoyer à n8n
  # -------------------------
  location ^~ /n8n/ {
    auth_basic off;
    proxy_pass http://n8n:5678/;
    proxy_http_version 1.1;

    # CRUCIAL: ne pas forward le BasicAuth staging à n8n
    proxy_set_header Authorization "";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /n8n;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
  }
}
