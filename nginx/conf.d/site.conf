# ------------------------------------------------------------
# WebSocket helper
# ------------------------------------------------------------
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ------------------------------------------------------------
# HTTP : ACME + redirect staging + maintenance prod
# ------------------------------------------------------------
server {
  listen 80;
  server_name gamenime.fr www.gamenime.fr staging.gamenime.fr;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  if ($host = staging.gamenime.fr) {
    return 301 https://$host$request_uri;
  }

  location / {
    root /etc/nginx/static;
    try_files /maintenance.html =503;
  }
}

# ------------------------------------------------------------
# HTTPS PROD : maintenance
# ------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name gamenime.fr www.gamenime.fr;

  ssl_certificate     /etc/letsencrypt/live/gamenime.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamenime.fr/privkey.pem;

  root /etc/nginx/static;

  location / {
    try_files /maintenance.html =503;
  }
}

# ------------------------------------------------------------
# HTTPS STAGING : privé (Basic Auth) + site + APIs + n8n
# ------------------------------------------------------------
server {
  listen 443 ssl;
  http2 on;
  server_name staging.gamenime.fr;

  ssl_certificate     /etc/letsencrypt/live/gamenime.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamenime.fr/privkey.pem;

  auth_basic "Staging prive";
  auth_basic_user_file /etc/nginx/htpasswd/staging.htpasswd;

  root /usr/share/nginx/html;
  index index.html;


  # -------------------------
  # APIs (content-api)
  # -------------------------
    location = /signin {
        auth_basic off;
        try_files $uri $uri/ /index.html;
    }
    location = /register {
        auth_basic off;
        try_files $uri $uri/ /index.html;
    }
    location /api/auth/ {
        auth_basic off;
        proxy_pass http://content-api:3000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/favorites/ {
        auth_basic off;
        proxy_pass http://content-api:3000/favorites/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/notifications/stream {
        auth_basic off;
        proxy_pass http://content-api:3000/notifications/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }
    location /api/notifications/ {
        auth_basic off;
        proxy_pass http://content-api:3000/notifications/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/premium/ {
        auth_basic off;
        proxy_pass http://content-api:3000/premium/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

  location /api/anime/ {
    auth_basic off;
    proxy_pass http://content-api:3000/anime/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/games/ {
    auth_basic off;
    proxy_pass http://content-api:3000/games/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/feed/ {
    auth_basic off;
    proxy_pass http://content-api:3000/feed/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # -------------------------
  # n8n PUSH (WebSocket)
  # -------------------------
  location ^~ /n8n/rest/push {
    auth_basic off;
    proxy_pass http://n8n:5678/rest/push;
    proxy_http_version 1.1;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /n8n;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
  }

  # Socket.IO
  location ^~ /n8n/socket.io/ {
    auth_basic off;
    proxy_pass http://n8n:5678/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /n8n;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
  }

  # -------------------------
  # n8n (UI + REST + assets)
  # -------------------------
  location ^~ /n8n/ {
    auth_basic off;
    proxy_pass http://n8n:5678/;
    proxy_http_version 1.1;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /n8n;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
  }

  # -------------------------
  # GameNime Dashboard — SSE stream (auth off pour EventSource)
  # -------------------------
  location = /dashboard/stream {
    auth_basic off;
    rewrite ^/dashboard/stream$ /admin/dashboard/stream break;
    proxy_pass http://content-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }
  # GameNime Dashboard (Basic Auth = staging existant)
  # -------------------------
  location ^~ /dashboard {
    rewrite ^/dashboard/?$ /admin/dashboard break;
    rewrite ^/dashboard/(.*)$ /admin/dashboard/$1 break;
    proxy_pass http://content-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE-friendly (stream temps réel)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }
  # -------------------------
  # Site statique (fallback)
  # -------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
