# En-tetes de securite (ZAP passive scan). Inclus au niveau server ET dans
# chaque location qui possede son propre add_header, sinon nginx ecrase
# tous les headers herites.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https:; font-src 'self' https: data:; frame-ancestors 'self'; base-uri 'self'" always;
